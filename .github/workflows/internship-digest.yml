name: Summer 2027 internship digest

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-opportunity-openai-workflows
  cancel-in-progress: false

jobs:
  send-internship-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      CV_TEXT: ${{ secrets.CV_TEXT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      JOB_TRACKER_SPREADSHEET_ID: ${{ vars.JOB_TRACKER_SPREADSHEET_ID }}
      APPLICATION_CALENDAR_ID: ${{ vars.APPLICATION_CALENDAR_ID }}
      INTERNSHIP_SEARCH_PROFILE: ${{ vars.INTERNSHIP_SEARCH_PROFILE }}
      INTERNSHIP_LOCATIONS: ${{ vars.INTERNSHIP_LOCATIONS }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore completed schedule slot
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: internship_schedule_state.json
          key: internship-schedule-v1-${{ github.run_id }}
          restore-keys: |
            internship-schedule-v1-

      - name: Check due schedule slot
        id: schedule
        shell: bash
        run: |
          python schedule_gate.py \
            --event "${{ github.event_name }}" \
            --state internship_schedule_state.json \
            --hours 8 13 18 >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Validate configuration
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          missing=0
          for name in OPENAI_API_KEY GMAIL_ADDRESS GMAIL_APP_PASSWORD EMAIL_TO CV_TEXT GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          for name in JOB_TRACKER_SPREADSHEET_ID APPLICATION_CALENDAR_ID INTERNSHIP_SEARCH_PROFILE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions variable: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create temporary private files
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          printf '%s\n' "$CV_TEXT" > cv.txt
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      - name: Read Internship Tracker
        if: steps.schedule.outputs.run == 'true'
        run: |
          python sync_applied_jobs.py \
            --credentials google-service-account.json \
            --spreadsheet-id "$JOB_TRACKER_SPREADSHEET_ID" \
            --tab "Internship Tracker" \
            --output existing_internships.json

      - name: Find Summer 2027 opportunities
        if: steps.schedule.outputs.run == 'true'
        run: |
          python internship_finder_agent.py \
            --cv cv.txt \
            --existing existing_internships.json \
            --output internships.json \
            --dry-run

      - name: Add discoveries to Internship Tracker
        if: steps.schedule.outputs.run == 'true'
        run: |
          python sync_internship_tracker.py \
            --credentials google-service-account.json \
            --spreadsheet-id "$JOB_TRACKER_SPREADSHEET_ID" \
            --input internships.json

      - name: Email internship digest
        if: steps.schedule.outputs.run == 'true'
        run: python internship_finder_agent.py --email-result internships.json

      - name: Add application deadlines to Google Calendar
        if: steps.schedule.outputs.run == 'true'
        run: |
          python sync_calendar_deadlines.py \
            --credentials google-service-account.json \
            --calendar-id "$APPLICATION_CALENDAR_ID" \
            --input internships.json \
            --source "Summer 2027 internship"

      - name: Remove temporary private files
        if: always() && steps.schedule.outputs.run == 'true'
        run: |
          rm -f cv.txt google-service-account.json
          rm -f existing_internships.json internships.json

      - name: Record completed schedule slot
        if: success() && github.event_name == 'schedule' && steps.schedule.outputs.run == 'true'
        run: printf '{"slot":"%s"}\n' "${{ steps.schedule.outputs.slot }}" > internship_schedule_state.json

      - name: Save completed schedule slot
        if: success() && github.event_name == 'schedule' && steps.schedule.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: internship_schedule_state.json
          key: internship-schedule-v1-${{ github.run_id }}

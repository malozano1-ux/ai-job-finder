name: Summer 2027 internship digest

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summer-2027-internship-digest
  cancel-in-progress: false

jobs:
  send-internship-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      CV_TEXT: ${{ secrets.CV_TEXT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      JOB_TRACKER_SPREADSHEET_ID: ${{ vars.JOB_TRACKER_SPREADSHEET_ID }}
      INTERNSHIP_SEARCH_PROFILE: ${{ vars.INTERNSHIP_SEARCH_PROFILE }}
      INTERNSHIP_LOCATIONS: ${{ vars.INTERNSHIP_LOCATIONS }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

    steps:
      - name: Check scheduled local hour
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=America/Los_Angeles date +%H)"
          case "$local_hour" in
            08|13|18) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check out repository
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Validate configuration
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          missing=0
          for name in OPENAI_API_KEY GMAIL_ADDRESS GMAIL_APP_PASSWORD EMAIL_TO CV_TEXT GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          for name in JOB_TRACKER_SPREADSHEET_ID INTERNSHIP_SEARCH_PROFILE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions variable: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create temporary private files
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          printf '%s\n' "$CV_TEXT" > cv.txt
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      - name: Read Internship Tracker
        if: steps.schedule.outputs.run == 'true'
        run: |
          python sync_applied_jobs.py \
            --credentials google-service-account.json \
            --spreadsheet-id "$JOB_TRACKER_SPREADSHEET_ID" \
            --tab "Internship Tracker" \
            --output existing_internships.json

      - name: Find Summer 2027 opportunities
        if: steps.schedule.outputs.run == 'true'
        run: |
          python internship_finder_agent.py \
            --cv cv.txt \
            --existing existing_internships.json \
            --output internships.json \
            --dry-run

      - name: Add discoveries to Internship Tracker
        if: steps.schedule.outputs.run == 'true'
        run: |
          python sync_internship_tracker.py \
            --credentials google-service-account.json \
            --spreadsheet-id "$JOB_TRACKER_SPREADSHEET_ID" \
            --input internships.json

      - name: Email internship digest
        if: steps.schedule.outputs.run == 'true'
        run: python internship_finder_agent.py --email-result internships.json

      - name: Remove temporary private files
        if: always() && steps.schedule.outputs.run == 'true'
        run: |
          rm -f cv.txt google-service-account.json
          rm -f existing_internships.json internships.json
